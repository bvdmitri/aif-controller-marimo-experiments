name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-smoke:
    name: Tests + notebook smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install project + dev deps
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run --extra dev pytest -q

      - name: Run headless notebook smoke
        run: uv run python scripts/smoke_notebooks.py
