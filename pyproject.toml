[project]
name = "aif-controller-marimo-experiments"
version = "0.1.0"
description = "Two-layer Active Inference simulator for coupled traveller route choice and adaptive traffic signal control"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "jupyterlab>=4.5.7",
    "marimo>=0.23.7",
    "matplotlib<3.10",
    "notebook>=7.5.6",
    "numpy<2",
    "pandas<2.2",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aif_traffic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: full-scale characterization tests (real 90-day experiment, default 2000-traveller population). Skipped unless --runslow is given. Run with: pytest --runslow -s",
]
